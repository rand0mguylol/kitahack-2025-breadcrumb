name: breadcrumbs
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  camera: 0.10.6
  cloud_firestore: ^5.6.2
  cloud_functions: ^5.3.3
  csv: ^6.0.0
  file_picker: ^9.0.0
  firebase_auth: ^5.4.2
  firebase_core: ^3.10.1
  image_picker: ^1.1.2
  permission_handler: ^11.4.0
  provider: ^6.1.2
  go_router: ^14.7.2
  firebase_storage: ^12.4.4
  uuid: ^4.4.2
  fl_chart: ^0.70.2
  rive: 0.13.14
  firebase_app_check: ^0.3.2+5
  firebase_ui_auth: ^1.16.1
  firebase_ui_oauth_google: ^1.4.1
  flutter_markdown: ^0.7.7
  syncfusion_flutter_charts: ^29.1.40

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/meal/
    - assets/images/restaurant/
    - assets/images/brand/
    - assets/rive/
    - assets/images/meal_planner/
    - assets/images/food/
    - assets/images/mascot/
